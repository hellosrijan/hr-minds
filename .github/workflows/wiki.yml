name: Wiki

# On every push to main: the wiki-keeper agent updates wiki/ and commits it,
# then wiki/ is mirrored to the GitHub wiki (<repo>.wiki.git).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Skipped when only wiki/ changed, or when no API key is configured.
      - name: Check for code changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "range=$BEFORE..$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- . ':!wiki'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update wiki with Claude
        if: steps.changes.outputs.code == 'true' && env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow the instructions in .claude/agents/wiki-keeper.md.
            Commit range to document: ${{ steps.changes.outputs.range }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add wiki/:*),Bash(git commit:*)"

      - name: Push wiki commit to main
        run: git push origin HEAD:main

      - name: Publish wiki/ to GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          rsync -a --delete --exclude .git wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Wiki unchanged"; exit 0; }
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
